      <stop stop-color="#394466" stop-opacity=".48"/>
      <stop offset=".5" stop-color="#243150" stop-opacity=".58"/>
      <stop offset="1" stop-color="#303749" stop-opacity=".45"/>
    </linearGradient>
    <radialGradient id="light" cx="184" cy="136" r="112" gradientUnits="userSpaceOnUse" gradientTransform="translate(0 78.88) scale(1 .42)">
